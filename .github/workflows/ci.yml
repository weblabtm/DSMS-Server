name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            DSMS-Server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('DSMS-Server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: ./

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./

      - name: Build
        run: npm run build
        working-directory: ./

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dsms:dsms@127.0.0.1:5432/dsms
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:ci
        working-directory: ./

  build:
    name: Build server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            DSMS-Server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('DSMS-Server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: DSMS-Server

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: DSMS-Server

      - name: Build server
        run: npm run build
        working-directory: DSMS-Server
