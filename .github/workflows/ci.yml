name: CI

on:
  push:
    branches: [ dev, main, master ]
  pull_request:
    branches: [ dev, main, master ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dsms
          POSTGRES_PASSWORD: dsms
          POSTGRES_DB: dsms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsms"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Vercel build
        run: npm run vercel-build

      - name: Build Prisma schema & generate client
        run: |
          npm run prisma:build-schema
          npx prisma generate --schema=prisma/schema.prisma

      - name: Apply migrations (deploy)
        env:
          DATABASE_URL: postgresql://dsms:dsms@127.0.0.1:5432/dsms
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Run seeders (if needed)
        env:
          DATABASE_URL: postgresql://dsms:dsms@127.0.0.1:5432/dsms
        run: |
          if [ -f dist/scripts/seed-rbac.js ]; then
            node dist/scripts/seed-rbac.js
          else
            npx tsx src/scripts/seed-rbac.ts
          fi

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dsms:dsms@127.0.0.1:5432/dsms
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:ci

  build:
    name: Build server
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Vercel build
        run: npm run vercel-build
